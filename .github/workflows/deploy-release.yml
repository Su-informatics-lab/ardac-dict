name: Deploy Release to S3

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'   # Release tags only (e.g., 1.2.3) — excludes dev/pre-release tags

permissions:
  contents: read    # This is required for actions/checkout
  id-token: write   # This is required for GitHub OIDC

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ardac-dict-deployer
          aws-region: ${{ secrets.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-duration-seconds: 900
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Get tag name
        id: get_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Upload schema.json to S3
        run: |
          aws s3 cp schema.json s3://${{ secrets.AWS_S3_BUCKET }}/${{ env.TAG_NAME }}/schema.json
